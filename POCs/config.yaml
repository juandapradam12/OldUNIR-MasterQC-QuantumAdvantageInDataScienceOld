# Configuración global de experimentos

# Directorios
data:
  input_dir: "data/input"
  output_dir: "data/output"

output:
  figures_dir: "data/output/figures"
  metrics_dir: "data/output/metrics"

# Configuración de experimentos
experiments:
  random_state: 42
  test_size: 0.2
  n_features: 4  # Número de features para reducción dimensional
  
# Configuración de clasificación
classification:
  sample_size: null  # null = usar dataset completo
  cv_folds: 5
  
# Configuración de regresión
regression:
  sample_size: null
  cv_folds: 5
  
# Configuración de optimización
optimization:
  max_iterations: 1000
  
# Configuración de modelos cuánticos
quantum:
  simulator: "qasm_simulator"  # o "statevector_simulator"
  shots: 1024
  optimization_level: 1
  
  # QAOA
  qaoa:
    p: 1
    optimizer: "COBYLA"
    max_iter: 100
  
  # VQC/VQR
  variational:
    reps: 3
    entanglement: "linear"
    optimizer: "COBYLA"
    max_iter: 100
  
  # Quantum Kernel
  kernel:
    reps: 2
    entanglement: "full"

# Configuración de modelos clásicos
classical:
  svm:
    kernel: "rbf"
    C: 1.0
    gamma: "scale"
  
  random_forest:
    n_estimators: 100
    max_depth: 10
  
  gradient_boosting:
    n_estimators: 100
    learning_rate: 0.1
    max_depth: 3
  
  xgboost:
    n_estimators: 100
    learning_rate: 0.1
    max_depth: 3

# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
